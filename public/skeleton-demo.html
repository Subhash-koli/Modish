<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeleton Loading Screen — Pure CSS</title>
  <style>
    /* ════════════════════════════════════════════════════
       CSS CUSTOM PROPERTIES — change 2-3 to switch theme
       ════════════════════════════════════════════════════ */
    :root {
      --skeleton-base:    #1a1a1a;
      --skeleton-shimmer: linear-gradient(
        90deg,
        transparent                  0%,
        rgba(255, 255, 255, 0.04)   30%,
        rgba(255, 255, 255, 0.08)   50%,
        rgba(255, 255, 255, 0.04)   70%,
        transparent                 100%
      );
      --skeleton-speed: 1.8s;

      /* Page chrome */
      --page-bg:      #0a0a0a;
      --card-bg:      #111111;
      --card-border:  rgba(255, 255, 255, 0.06);
      --row-divider:  rgba(255, 255, 255, 0.06);
      --label-color:  rgba(255, 255, 255, 0.28);
    }

    /* ── Light-theme override (uncomment or toggle with a class) ──
    .theme-light {
      --skeleton-base:    #e4e4e7;
      --skeleton-shimmer: linear-gradient(
        90deg,
        transparent             0%,
        rgba(0,0,0,0.04)       30%,
        rgba(0,0,0,0.08)       50%,
        rgba(0,0,0,0.04)       70%,
        transparent            100%
      );
      --page-bg:      #f4f4f5;
      --card-bg:      #ffffff;
      --card-border:  rgba(0,0,0,0.08);
      --row-divider:  rgba(0,0,0,0.08);
      --label-color:  rgba(0,0,0,0.35);
    }
    ── */

    /* ════════════════════════════════════════════════════
       BASE RESET
       ════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--page-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
      gap: 56px;
    }

    /* ════════════════════════════════════════════════════
       SECTION WRAPPER & LABELS
       ════════════════════════════════════════════════════ */
    .demo-section {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .demo-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--label-color);
      padding-left: 2px;
    }

    /* ════════════════════════════════════════════════════
       SKELETON BASE CLASS
       Shimmer lives on ::after — never touches layout
       ════════════════════════════════════════════════════ */
    .skeleton {
      background-color: var(--skeleton-base);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--skeleton-shimmer);
      background-size: 200% 100%;
      animation: shimmer var(--skeleton-speed) ease-in-out infinite;
    }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }

    /* ════════════════════════════════════════════════════
       SHAPE MODIFIERS
       ════════════════════════════════════════════════════ */
    .skeleton--circle {
      border-radius: 50%;
      flex-shrink: 0;
    }

    .skeleton--text {
      height: 14px;
    }

    .skeleton--text-sm {
      height: 11px;
    }

    .skeleton--image {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 8px 8px 0 0; /* flush top corners inside card */
    }

    /* ════════════════════════════════════════════════════
       PATTERN 1 — PROFILE HEADER
       ════════════════════════════════════════════════════ */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px 20px;
    }

    .profile-header__avatar {
      width: 56px;
      height: 56px;
    }

    .profile-header__lines {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* ════════════════════════════════════════════════════
       PATTERN 2 — CARD GRID
       ════════════════════════════════════════════════════ */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    @media (max-width: 640px) {
      .card-grid { grid-template-columns: 1fr; }
    }

    .sk-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .sk-card__body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
    }

    /* ════════════════════════════════════════════════════
       PATTERN 3 — CONTENT LIST
       ════════════════════════════════════════════════════ */
    .content-list {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
    }

    .list-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--row-divider);
    }

    .list-row:last-child {
      border-bottom: none;
    }

    .list-row__avatar {
      width: 40px;
      height: 40px;
    }

    .list-row__lines {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex: 1;
    }

    /* ════════════════════════════════════════════════════
       ACCESSIBILITY — prefers-reduced-motion
       ════════════════════════════════════════════════════ */
    @media (prefers-reduced-motion: reduce) {
      .skeleton::after {
        animation: none;
        background-image: none;
      }
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════
       PATTERN 1 — PROFILE HEADER
       ══════════════════════════════════════════════════════ -->
  <section class="demo-section" aria-busy="true" aria-label="Loading profile">
    <div class="demo-label" aria-hidden="true">Pattern 1 — Profile Header</div>

    <div class="profile-header">
      <!-- 56px circular avatar -->
      <div class="skeleton skeleton--circle profile-header__avatar" aria-hidden="true"></div>

      <!-- Name + bio lines -->
      <div class="profile-header__lines">
        <!-- name: 40% wide, 14px tall -->
        <div class="skeleton skeleton--text" style="width:40%;" aria-hidden="true"></div>
        <!-- bio: 65% wide, 11px tall -->
        <div class="skeleton skeleton--text-sm" style="width:65%;" aria-hidden="true"></div>
      </div>
    </div>
  </section>


  <!-- ══════════════════════════════════════════════════════
       PATTERN 2 — CARD GRID (3 col → 1 col < 640px)
       ══════════════════════════════════════════════════════ -->
  <section class="demo-section" aria-busy="true" aria-label="Loading card grid">
    <div class="demo-label" aria-hidden="true">Pattern 2 — Card Grid</div>

    <div class="card-grid">

      <!-- Card 1 -->
      <article class="sk-card" aria-hidden="true">
        <div class="skeleton skeleton--image"></div>
        <div class="sk-card__body">
          <div class="skeleton skeleton--text"    style="width:100%;"></div>
          <div class="skeleton skeleton--text-sm" style="width:80%;"></div>
          <div class="skeleton skeleton--text-sm" style="width:50%;"></div>
        </div>
      </article>

      <!-- Card 2 -->
      <article class="sk-card" aria-hidden="true">
        <div class="skeleton skeleton--image"></div>
        <div class="sk-card__body">
          <div class="skeleton skeleton--text"    style="width:100%;"></div>
          <div class="skeleton skeleton--text-sm" style="width:80%;"></div>
          <div class="skeleton skeleton--text-sm" style="width:50%;"></div>
        </div>
      </article>

      <!-- Card 3 -->
      <article class="sk-card" aria-hidden="true">
        <div class="skeleton skeleton--image"></div>
        <div class="sk-card__body">
          <div class="skeleton skeleton--text"    style="width:100%;"></div>
          <div class="skeleton skeleton--text-sm" style="width:80%;"></div>
          <div class="skeleton skeleton--text-sm" style="width:50%;"></div>
        </div>
      </article>

    </div>
  </section>


  <!-- ══════════════════════════════════════════════════════
       PATTERN 3 — CONTENT LIST (4 rows)
       ══════════════════════════════════════════════════════ -->
  <section class="demo-section" aria-busy="true" aria-label="Loading content list">
    <div class="demo-label" aria-hidden="true">Pattern 3 — Content List</div>

    <div class="content-list">

      <!-- Row 1 -->
      <div class="list-row" aria-hidden="true">
        <div class="skeleton skeleton--circle list-row__avatar"></div>
        <div class="list-row__lines">
          <div class="skeleton skeleton--text"    style="width:55%;"></div>
          <div class="skeleton skeleton--text-sm" style="width:35%;"></div>
        </div>
      </div>

      <!-- Row 2 -->
      <div class="list-row" aria-hidden="true">
        <div class="skeleton skeleton--circle list-row__avatar"></div>
        <div class="list-row__lines">
          <div class="skeleton skeleton--text"    style="width:55%;"></div>
          <div class="skeleton skeleton--text-sm" style="width:35%;"></div>
        </div>
      </div>

      <!-- Row 3 -->
      <div class="list-row" aria-hidden="true">
        <div class="skeleton skeleton--circle list-row__avatar"></div>
        <div class="list-row__lines">
          <div class="skeleton skeleton--text"    style="width:55%;"></div>
          <div class="skeleton skeleton--text-sm" style="width:35%;"></div>
        </div>
      </div>

      <!-- Row 4 -->
      <div class="list-row" aria-hidden="true">
        <div class="skeleton skeleton--circle list-row__avatar"></div>
        <div class="list-row__lines">
          <div class="skeleton skeleton--text"    style="width:55%;"></div>
          <div class="skeleton skeleton--text-sm" style="width:35%;"></div>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
