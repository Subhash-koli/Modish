      <style>
        html, body { margin: 0; padding: 0; }

        /* ── Skeleton CSS custom properties ── */
        :root {
          --sk-bg:    #f4f4f4;
          --sk-base:  #e2e2e2;
          --sk-shine: rgba(255,255,255,0.80);
          --sk-speed: 1.6s;
          --sk-yellow: #FFCC00;
        }

        /* ── Skeleton container ── */
        #skeleton {
          position: fixed;
          inset: 0;
          z-index: 99999;
          background: var(--sk-bg);
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }
        /* Auto-hide once React has mounted content into #root */
        #root:not(:empty) ~ #skeleton {
          display: none;
        }

        /* ── Shimmer keyframe ── */
        @keyframes sk-shimmer {
          0%   { background-position: -200% center; }
          100% { background-position:  200% center; }
        }

        /* ── Base skeleton block ── */
        .sk {
          background: var(--sk-base);
          border-radius: 8px;
          position: relative;
          overflow: hidden;
          flex-shrink: 0;
        }
        .sk::after {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(
            90deg,
            transparent 0%,
            var(--sk-shine) 40%,
            var(--sk-shine) 60%,
            transparent 100%
          );
          background-size: 200% 100%;
          animation: sk-shimmer var(--sk-speed) ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
          .sk::after { animation: none; }
        }

        /* ── Header ── */
        .sk-header {
          height: 70px;
          background: #fff;
          border-bottom: 1px solid #ebebeb;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 20px;
          gap: 16px;
          flex-shrink: 0;
        }
        .sk-logo { width: 90px; height: 30px; }
        .sk-nav  { display: flex; gap: 14px; }
        .sk-nav .sk { height: 11px; border-radius: 6px; }
        .sk-btn {
          width: 96px; height: 34px;
          border-radius: 9999px;
          background: var(--sk-yellow) !important;
          opacity: 0.5;
        }
        .sk-btn::after { display: none; }
        /* hide nav on mobile */
        @media (max-width: 640px) { .sk-nav { display: none; } }

        /* ── Hero carousel ── */
        .sk-hero {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          padding: 20px 8px 10px;
          flex-shrink: 0;
        }
        .sk-hcard { border-radius: 14px; }
        .sk-hcard--side   { width: 16vw; height: 280px; }
        .sk-hcard--center {
          width: 66vw; height: 340px;
          border: 2.5px solid var(--sk-yellow);
          border-radius: 16px;
        }
        /* Desktop overrides */
        @media (min-width: 769px) {
          .sk-hcard--side   { width: 22vw; height: 380px; }
          .sk-hcard--center { width: 28vw; height: 440px; }
          .sk-hcard-extra   { display: none !important; }
        }
        .sk-hcard-extra { display: none; gap: 8px; }

        /* ── Pagination dots (mobile only) ── */
        .sk-dots {
          display: flex;
          justify-content: center;
          gap: 6px;
          padding-bottom: 8px;
          flex-shrink: 0;
        }
        @media (min-width: 769px) { .sk-dots { display: none; } }
        .sk-dot { height: 6px; border-radius: 3px; }
        .sk-dot--on  { width: 18px; background: var(--sk-yellow); }
        .sk-dot--off { width: 6px;  background: rgba(0,0,0,0.15); }

        /* ── Section badge label ── */
        .sk-badge {
          display: inline-block;
          height: 28px; width: 170px;
          border-radius: 9999px;
          margin: 14px 16px 12px;
          background: var(--sk-yellow) !important;
          opacity: 0.45;
        }
        .sk-badge::after { display: none; }

        /* ── Product grid ── */
        .sk-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
          padding: 0 14px 20px;
        }
        @media (min-width: 769px) {
          .sk-grid { grid-template-columns: repeat(3,1fr); padding: 0 40px 28px; gap: 16px; }
        }
        .sk-card {
          background: #fff;
          border-radius: 12px;
          border: 1px solid rgba(0,0,0,0.06);
          overflow: hidden;
        }
        .sk-card-img {
          width: 100%; aspect-ratio: 3/4;
          background: var(--sk-base);
          position: relative; overflow: hidden;
        }
        .sk-card-img::after {
          content: '';
          position: absolute; inset: 0;
          background: linear-gradient(90deg, transparent 0%, var(--sk-shine) 40%, var(--sk-shine) 60%, transparent 100%);
          background-size: 200% 100%;
          animation: sk-shimmer var(--sk-speed) ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) { .sk-card-img::after { animation: none; } }
        .sk-card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
        .sk-line {
          background: var(--sk-base); border-radius: 4px; height: 11px;
          position: relative; overflow: hidden;
        }
        .sk-line::after {
          content: '';
          position: absolute; inset: 0;
          background: linear-gradient(90deg, transparent 0%, var(--sk-shine) 40%, var(--sk-shine) 60%, transparent 100%);
          background-size: 200% 100%;
          animation: sk-shimmer var(--sk-speed) ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) { .sk-line::after { animation: none; } }
        .sk-line--full  { width: 100%; }
        .sk-line--mid   { width: 65%; }
        .sk-line--short { width: 38%; height: 9px; }
      </style>
    </head>
